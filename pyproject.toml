[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "advdetect-research"
version = "0.1.0"
description = "Configurable adversarial detection research workspace"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24", "torch>=2.5", "torchvision>=0.20",
    "PyYAML>=6", "scikit-learn>=1.3", "Pillow>=9", "torchattacks==3.5.1", "timm>=1.0.30"
]

[project.scripts]
advdetect = "advdetect.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
